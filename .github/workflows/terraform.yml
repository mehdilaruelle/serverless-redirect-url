name: Terraform

on:
  push:
    branches: [main]
  pull_request:
  # Provider upgrades break configurations silently. Catch it weekly rather
  # than the next time someone needs to deploy.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: fmt + validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # -backend=false: no credentials and no state are needed to validate.
      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color
